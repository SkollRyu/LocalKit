<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#111315;
    --muted:#5B6472;
    --line:#E3E3E1;
    --accent:#2452D9;
    --accent-dark:#1B3EA8;
    --red:#C1483F;
    --amber:#C58A2E;
    --green:#2E8B57;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
  }

  .sr-only{
    position:absolute;width:1px;height:1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;
  }

  *:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .page{
    max-width:600px;
    margin:0 auto;
    padding:56px 40px 64px;
  }
  @media (max-width:600px){
    .page{padding:32px 20px 48px;}
  }

  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:32px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
    margin-bottom:40px;
  }
  .page-header h1{
    font-size:clamp(1.7rem, 3vw, 2.3rem);
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  .page-header p{
    margin:0;
    max-width:320px;
    font-size:0.92rem;
    line-height:1.5;
    color:var(--muted);
    text-align:right;
  }
  @media (max-width:640px){
    .page-header{flex-direction:column;align-items:flex-start;gap:8px;}
    .page-header p{text-align:left;max-width:none;}
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:40px;
    max-width:520px;
    margin:0 auto;
  }

  .col-secondary{
    border-top:1px solid var(--line);
    padding-top:32px;
  }

  /* ---- readout ---- */

  .readout-frame{
    position:relative;
    padding:12px;
  }
  .bracket{
    position:absolute;
    width:20px;height:20px;
    border-color:var(--accent);
    border-style:solid;
    border-width:0;
  }
  .bracket.tl{top:0;left:0;border-top-width:2px;border-left-width:2px;}
  .bracket.tr{top:0;right:0;border-top-width:2px;border-right-width:2px;}
  .bracket.bl{bottom:0;left:0;border-bottom-width:2px;border-left-width:2px;}
  .bracket.br{bottom:0;right:0;border-bottom-width:2px;border-right-width:2px;}

  .readout{
    --pw-max-size:22px;
    min-height:64px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 22px;
    display:flex;
    align-items:center;
  }
  @media (max-width:480px){ .readout{--pw-max-size:17px;min-height:56px;padding:16px 18px;} }

  .readout.is-error{
    align-items:center;
    color:var(--muted);
    font-size:0.95rem;
    font-style:italic;
  }

  .pw-text{
    display:block;
    width:100%;
    font-family:var(--mono);
    font-weight:500;
    letter-spacing:0.02em;
    line-height:1.3;
    white-space:nowrap;
    overflow-wrap:anywhere;
  }

  .ch-num{color:var(--accent);}
  .ch-sym{color:var(--red);}

  .error-msg{
    font-size:0.85rem;
    color:var(--red);
    margin-top:12px;
  }

  .actions-row{
    display:flex;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width:150px;
    justify-content:center;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--sans);
    font-size:0.92rem;
    font-weight:600;
    padding:13px 20px;
    border-radius:3px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .btn svg{width:16px;height:16px;flex-shrink:0;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn:not(.btn-primary):hover{background:#F2F2F0;}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.copied{border-color:var(--green);color:var(--green);}
  .btn-primary.copied{background:var(--green);border-color:var(--green);color:#fff;}

  .btn.spin svg{animation:spin .5s ease;}
  @keyframes spin{to{transform:rotate(180deg);}}

  /* ---- gauge ---- */

  .gauge-section{
    margin-top:36px;
    display:flex;
    align-items:center;
    gap:20px;
  }
  .gauge-section svg{width:120px;height:auto;flex-shrink:0;}
  .gauge-copy{}
  .strength-label{font-weight:700;font-size:1.05rem;}
  .strength-bits{font-size:0.85rem;color:var(--muted);margin-top:2px;}

  /* ---- fields ---- */

  section{margin-bottom:28px;}
  section:last-child{margin-bottom:0;}

  .field-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .field-row label{font-size:0.92rem;font-weight:600;}
  .length-value{font-family:var(--mono);font-size:1rem;color:var(--accent);}

  input[type="range"]{
    width:100%;height:24px;
    -webkit-appearance:none;appearance:none;
    background:transparent;cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:
      repeating-linear-gradient(90deg, #C7C7C3 0px, #C7C7C3 1px, transparent 1px, transparent 8.8%),
      var(--line);
  }
  input[type="range"]::-moz-range-track{height:4px;border-radius:2px;background:var(--line);}
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    margin-top:-6px;
    background:var(--accent);
    border:2.5px solid #fff;
    box-shadow:0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.25);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);border:2.5px solid #fff;
    box-shadow:0 0 0 1px var(--line);
  }

  .toggle-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 20px;
  }
  @media (max-width:420px){.toggle-grid{grid-template-columns:1fr;}}

  .check-row{
    display:flex;align-items:center;gap:10px;
    cursor:pointer;font-size:0.92rem;
  }
  .check-row input{position:absolute;opacity:0;width:1px;height:1px;}
  .checkbox{
    flex-shrink:0;width:19px;height:19px;
    border:1.5px solid var(--ink);border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    transition:background .12s, border-color .12s;
  }
  .checkbox svg{width:12px;height:12px;stroke:#fff;opacity:0;transform:scale(.6);transition:opacity .12s, transform .12s;}
  .check-row input:checked + .checkbox{background:var(--accent);border-color:var(--accent);}
  .check-row input:checked + .checkbox svg{opacity:1;transform:scale(1);}
  .check-row input:focus-visible + .checkbox{outline:2px solid var(--accent);outline-offset:2px;}

  details{border-top:1px solid var(--line);padding-top:20px;}
  summary{
    cursor:pointer;font-size:0.92rem;font-weight:600;
    list-style:none;display:flex;align-items:center;gap:6px;
  }
  summary::-webkit-details-marker{display:none;}
  summary::before{
    content:'▸';color:var(--accent);font-size:0.75rem;
    display:inline-block;transition:transform .15s;
  }
  details[open] summary::before{transform:rotate(90deg);}

  .advanced-body{margin-top:18px;display:flex;flex-direction:column;gap:16px;}

  .text-field{display:flex;flex-direction:column;gap:6px;}
  .text-field label{font-size:0.9rem;font-weight:600;}
  .text-field input[type="text"]{
    background:#fff;border:1px solid var(--line);border-radius:3px;
    color:var(--ink);font-family:var(--mono);font-size:0.9rem;
    padding:10px 12px;
  }
  .text-field input[type="text"]:focus{border-color:var(--accent);}
  .text-field input[type="text"]::placeholder{color:#B4B8BE;}

  /* ---- recent ---- */

  .recent h2{font-size:0.92rem;font-weight:600;margin:0 0 6px;}
  .recent-list{list-style:none;margin:0;padding:0;}
  .recent-list li{
    display:flex;align-items:center;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .recent-list li:last-child{border-bottom:none;}
  .rec-pw{
    flex:1;min-width:0;font-family:var(--mono);font-size:0.85rem;
    color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rec-copy{
    background:none;border:none;color:var(--accent);
    font-size:0.82rem;font-weight:600;cursor:pointer;padding:2px 4px;flex-shrink:0;
  }
  .rec-copy:hover{text-decoration:underline;}
  .recent-empty{font-size:0.85rem;color:var(--muted);font-style:italic;padding:11px 0;}

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:0.8rem;
    color:var(--muted);
  }

  @media (prefers-reduced-motion:reduce){
    .btn.spin svg{animation:none;}
    #gaugeNeedle{transition:none !important;}
  }
</style>
</head>
<body>

<div class="page">
  <header class="page-header">
    <h1>Password Generator</h1>
    <p>Create a strong, random password. Generated locally in your browser — nothing is sent or stored.</p>
  </header>

  <div id="liveRegion" class="sr-only" aria-live="polite"></div>

  <div class="grid">

    <div class="col col-primary">
      <div class="readout-frame">
        <span class="bracket tl"></span>
        <span class="bracket tr"></span>
        <span class="bracket bl"></span>
        <span class="bracket br"></span>
        <div id="readout" class="readout" role="status">
          <span id="pwText" class="pw-text"></span>
        </div>
      </div>
      <div id="errorMsg" class="error-msg" hidden></div>

      <div class="actions-row">
        <button id="copyBtn" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
          <span id="copyBtnLabel">Copy password</span>
        </button>
        <button id="regenBtn" class="btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
          <span>New password</span>
        </button>
      </div>

      <div class="gauge-section">
        <svg id="gaugeSvg" viewBox="0 0 200 112" aria-hidden="true"></svg>
        <div class="gauge-copy">
          <div id="strengthLabel" class="strength-label">—</div>
          <div id="strengthBits" class="strength-bits">—</div>
        </div>
      </div>
    </div>

    <div class="col col-secondary">
      <section>
        <div class="field-row">
          <label for="lengthRange">Length</label>
          <span id="lengthValue" class="length-value">16</span>
        </div>
        <input type="range" id="lengthRange" min="4" max="64" value="16" aria-describedby="lengthValue">
      </section>

      <section>
        <div class="toggle-grid">
          <label class="check-row">
            <input type="checkbox" id="toggleUpper" checked>
            <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            Uppercase letters (A–Z)
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggleLower" checked>
            <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            Lowercase letters (a–z)
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggleNumbers" checked>
            <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            Numbers (0–9)
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggleSymbols" checked>
            <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            Symbols (!@#$…)
          </label>
        </div>
      </section>

      <details>
        <summary>Advanced options</summary>
        <div class="advanced-body">
          <label class="check-row">
            <input type="checkbox" id="excludeAmbiguous">
            <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            Avoid ambiguous characters (I, l, 1, O, 0)
          </label>
          <label class="check-row">
            <input type="checkbox" id="guaranteeEach" checked>
            <span class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            Include at least one of each selected type
          </label>
          <div class="text-field">
            <label for="customExclude">Exclude specific characters</label>
            <input type="text" id="customExclude" placeholder="e.g. &amp; % &quot;">
          </div>
        </div>
      </details>

      <section class="recent" style="margin-top:28px;">
        <h2>Recent</h2>
        <ul id="recentList" class="recent-list"></ul>
      </section>
    </div>

  </div>

  <footer>Passwords are generated using your browser's cryptographic random number generator and are never transmitted or saved.</footer>
</div>

<script>
(function(){
  "use strict";

  var CHARSETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    numbers: "0123456789",
    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?/~"
  };
  var AMBIGUOUS = "Il1O0o";

  var els = {
    readout: document.getElementById("readout"),
    pwText: document.getElementById("pwText"),
    copyBtn: document.getElementById("copyBtn"),
    copyBtnLabel: document.getElementById("copyBtnLabel"),
    regenBtn: document.getElementById("regenBtn"),
    errorMsg: document.getElementById("errorMsg"),
    lengthRange: document.getElementById("lengthRange"),
    lengthValue: document.getElementById("lengthValue"),
    toggleUpper: document.getElementById("toggleUpper"),
    toggleLower: document.getElementById("toggleLower"),
    toggleNumbers: document.getElementById("toggleNumbers"),
    toggleSymbols: document.getElementById("toggleSymbols"),
    excludeAmbiguous: document.getElementById("excludeAmbiguous"),
    guaranteeEach: document.getElementById("guaranteeEach"),
    customExclude: document.getElementById("customExclude"),
    gaugeSvg: document.getElementById("gaugeSvg"),
    strengthLabel: document.getElementById("strengthLabel"),
    strengthBits: document.getElementById("strengthBits"),
    recentList: document.getElementById("recentList"),
    liveRegion: document.getElementById("liveRegion")
  };

  var currentPassword = "";
  var recent = [];
  var gaugeNeedle = null;
  var resizeTimer = null;

  // ---------- secure random helpers ----------

  function secureRandomInt(maxExclusive){
    if (maxExclusive <= 0) return 0;
    if (maxExclusive > 256) maxExclusive = 256;
    var range = 256 - (256 % maxExclusive);
    var byte;
    do {
      byte = window.crypto.getRandomValues(new Uint8Array(1))[0];
    } while (byte >= range);
    return byte % maxExclusive;
  }

  function secureShuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = secureRandomInt(i + 1);
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function pickRandomChar(str){
    return str.charAt(secureRandomInt(str.length));
  }

  // ---------- gauge ----------

  function polarToCartesian(cx, cy, r, angleDeg){
    var rad = angleDeg * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  }

  function arcPath(startAngle, endAngle){
    var s = polarToCartesian(100, 100, 90, startAngle);
    var e = polarToCartesian(100, 100, 90, endAngle);
    return "M " + s.x.toFixed(2) + " " + s.y.toFixed(2) +
           " A 90 90 0 0 1 " + e.x.toFixed(2) + " " + e.y.toFixed(2);
  }

  function buildGauge(){
    var svg = els.gaugeSvg;
    var zones = [
      { from: 180, to: 124.2, color: "var(--red)" },
      { from: 124.2, to: 81, color: "var(--amber)" },
      { from: 81, to: 39.6, color: "var(--green)" },
      { from: 39.6, to: 0, color: "var(--accent)" }
    ];
    var svgNS = "http://www.w3.org/2000/svg";
    zones.forEach(function(z){
      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", arcPath(z.from, z.to));
      path.setAttribute("stroke", z.color);
      path.setAttribute("stroke-width", "10");
      path.setAttribute("stroke-linecap", "butt");
      path.setAttribute("fill", "none");
      svg.appendChild(path);
    });
    var needle = document.createElementNS(svgNS, "line");
    needle.setAttribute("id", "gaugeNeedle");
    needle.setAttribute("x1", "100");
    needle.setAttribute("y1", "100");
    needle.setAttribute("x2", "100");
    needle.setAttribute("y2", "22");
    needle.setAttribute("stroke", "var(--ink)");
    needle.setAttribute("stroke-width", "3");
    needle.setAttribute("stroke-linecap", "round");
    needle.style.transformOrigin = "100px 100px";
    needle.style.transform = "rotate(-90deg)";
    needle.style.transition = "transform 0.5s cubic-bezier(.34,1.56,.64,1)";
    svg.appendChild(needle);
    var pivot = document.createElementNS(svgNS, "circle");
    pivot.setAttribute("cx", "100");
    pivot.setAttribute("cy", "100");
    pivot.setAttribute("r", "5");
    pivot.setAttribute("fill", "var(--ink)");
    svg.appendChild(pivot);
    gaugeNeedle = needle;
  }

  function updateGauge(bits){
    var pct = Math.min(Math.max(bits / 128, 0), 1);
    var rotation = pct * 180 - 90;
    if (gaugeNeedle) gaugeNeedle.style.transform = "rotate(" + rotation + "deg)";
  }

  function classifyStrength(bits){
    if (bits < 40) return { label: "Weak", color: "var(--red)" };
    if (bits < 70) return { label: "Fair", color: "var(--amber)" };
    if (bits < 100) return { label: "Strong", color: "var(--green)" };
    return { label: "Excellent", color: "var(--accent)" };
  }

  // ---------- password generation ----------

  function buildFilteredSet(str, excludeChars){
    var out = "";
    for (var i = 0; i < str.length; i++){
      var c = str.charAt(i);
      if (excludeChars.indexOf(c) === -1) out += c;
    }
    return out;
  }

  function generatePassword(){
    var length = parseInt(els.lengthRange.value, 10);
    var useUpper = els.toggleUpper.checked;
    var useLower = els.toggleLower.checked;
    var useNumbers = els.toggleNumbers.checked;
    var useSymbols = els.toggleSymbols.checked;
    var avoidAmbiguous = els.excludeAmbiguous.checked;
    var guaranteeEach = els.guaranteeEach.checked;
    var customExclude = els.customExclude.value || "";

    var excludeChars = customExclude + (avoidAmbiguous ? AMBIGUOUS : "");

    var sets = [];
    if (useUpper) sets.push({ key: "upper", chars: buildFilteredSet(CHARSETS.upper, excludeChars) });
    if (useLower) sets.push({ key: "lower", chars: buildFilteredSet(CHARSETS.lower, excludeChars) });
    if (useNumbers) sets.push({ key: "numbers", chars: buildFilteredSet(CHARSETS.numbers, excludeChars) });
    if (useSymbols) sets.push({ key: "symbols", chars: buildFilteredSet(CHARSETS.symbols, excludeChars) });

    if (sets.length === 0) return { error: "no-type" };

    var usableSets = sets.filter(function(s){ return s.chars.length > 0; });
    if (usableSets.length === 0) return { error: "no-chars" };

    var pool = usableSets.map(function(s){ return s.chars; }).join("");
    var resultChars = [];

    if (guaranteeEach){
      var numGuaranteed = Math.min(usableSets.length, length);
      for (var i = 0; i < numGuaranteed; i++){
        resultChars.push(pickRandomChar(usableSets[i].chars));
      }
      for (var j = resultChars.length; j < length; j++){
        resultChars.push(pickRandomChar(pool));
      }
      secureShuffle(resultChars);
    } else {
      for (var k = 0; k < length; k++){
        resultChars.push(pickRandomChar(pool));
      }
    }

    var password = resultChars.join("");
    var poolSize = new Set(pool.split("")).size;
    var bits = poolSize > 1 ? length * (Math.log(poolSize) / Math.log(2)) : 0;

    return { error: null, password: password, bits: bits };
  }

  function classOfChar(ch){
    if (CHARSETS.numbers.indexOf(ch) !== -1) return "ch-num";
    if (CHARSETS.symbols.indexOf(ch) !== -1) return "ch-sym";
    return "";
  }

  function renderReadout(password){
    els.readout.classList.remove("is-error");
    var frag = document.createDocumentFragment();
    for (var i = 0; i < password.length; i++){
      var span = document.createElement("span");
      var cls = classOfChar(password.charAt(i));
      if (cls) span.className = cls;
      span.textContent = password.charAt(i);
      frag.appendChild(span);
    }
    els.pwText.innerHTML = "";
    els.pwText.appendChild(frag);
    fitPasswordText();
  }

  function renderError(message){
    els.readout.classList.add("is-error");
    els.pwText.style.whiteSpace = "normal";
    els.pwText.style.fontSize = "";
    els.pwText.textContent = message;
  }

  // Shrinks the password text to fit on one line; if it still can't
  // fit at the minimum readable size, lets it wrap instead of overflowing.
  function fitPasswordText(){
    var box = els.pwText;
    if (!currentPasswordLength()) return;
    var cs = getComputedStyle(els.readout);
    var maxSize = parseFloat(cs.getPropertyValue("--pw-max-size")) || 28;
    var minSize = 14;

    box.style.whiteSpace = "nowrap";
    box.style.overflowWrap = "normal";
    var size = maxSize;
    box.style.fontSize = size + "px";

    while (size > minSize && box.scrollWidth > box.clientWidth){
      size -= 1;
      box.style.fontSize = size + "px";
    }

    if (box.scrollWidth > box.clientWidth){
      box.style.whiteSpace = "normal";
      box.style.overflowWrap = "anywhere";
    }
  }

  function currentPasswordLength(){
    return currentPassword.length;
  }

  function addToRecent(password){
    recent.unshift(password);
    if (recent.length > 5) recent.pop();
    renderRecent();
  }

  function renderRecent(){
    els.recentList.innerHTML = "";
    if (recent.length === 0){
      var li = document.createElement("li");
      li.className = "recent-empty";
      li.style.border = "none";
      li.textContent = "Generated passwords will appear here.";
      els.recentList.appendChild(li);
      return;
    }
    recent.forEach(function(pw){
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.className = "rec-pw";
      span.textContent = pw;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rec-copy";
      btn.textContent = "Copy";
      btn.addEventListener("click", function(){ copyText(pw); });
      li.appendChild(span);
      li.appendChild(btn);
      els.recentList.appendChild(li);
    });
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(announceCopied).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    announceCopied();
  }

  function announceCopied(){
    els.liveRegion.textContent = "Password copied to clipboard.";
    els.copyBtn.classList.add("copied");
    els.copyBtnLabel.textContent = "Copied";
    setTimeout(function(){
      els.copyBtn.classList.remove("copied");
      els.copyBtnLabel.textContent = "Copy password";
    }, 1200);
  }

  function refresh(spin){
    var result = generatePassword();

    if (result.error){
      currentPassword = "";
      els.copyBtn.disabled = true;
      var msg = result.error === "no-type"
        ? "Select at least one character type."
        : "Your exclusions removed every character from all selected types. Adjust exclusions or enable another type.";
      els.errorMsg.hidden = false;
      els.errorMsg.textContent = msg;
      renderError(msg);
      els.strengthLabel.textContent = "—";
      els.strengthBits.textContent = "—";
      updateGauge(0);
      return;
    }

    els.errorMsg.hidden = true;
    els.copyBtn.disabled = false;
    currentPassword = result.password;
    renderReadout(result.password);

    var strength = classifyStrength(result.bits);
    els.strengthLabel.textContent = strength.label;
    els.strengthLabel.style.color = strength.color;
    els.strengthBits.textContent = Math.round(result.bits) + " bits of entropy";
    updateGauge(result.bits);

    addToRecent(result.password);

    if (spin){
      els.regenBtn.classList.add("spin");
      setTimeout(function(){ els.regenBtn.classList.remove("spin"); }, 500);
    }
  }

  // ---------- wiring ----------

  els.lengthRange.addEventListener("input", function(){
    els.lengthValue.textContent = els.lengthRange.value;
    refresh(false);
  });

  [els.toggleUpper, els.toggleLower, els.toggleNumbers, els.toggleSymbols,
   els.excludeAmbiguous, els.guaranteeEach].forEach(function(el){
    el.addEventListener("change", function(){ refresh(false); });
  });

  els.customExclude.addEventListener("input", function(){ refresh(false); });

  els.regenBtn.addEventListener("click", function(){ refresh(true); });

  els.copyBtn.addEventListener("click", function(){
    if (currentPassword) copyText(currentPassword);
  });

  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (currentPassword) fitPasswordText();
    }, 120);
  });

  buildGauge();
  renderRecent();
  refresh(false);
})();
</script>
</body>
</html>
